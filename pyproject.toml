[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-first-local-ai"
version = "0.1.0"
description = "Local workstation memory with explainable privacy routing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
ui = ["prompt-toolkit>=3.0.48,<4"]
crypto = ["cryptography>=43,<47", "keyring>=25,<26"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "build>=1,<2"]

[project.scripts]
local-ai = "local_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_ai = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
